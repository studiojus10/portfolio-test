js_import spool from /etc/nginx/njs/spool.js;
limit_req_zone $binary_remote_addr zone=contact:1m rate=30r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Verified in production: $remote_addr is 172.28.0.1 (the Docker bridge
  # gateway) on every single request, because the container only ever sees
  # traffic arriving through Docker's own port-publishing NAT. Without this
  # block, limit_req_zone above keys on that one constant address -- every
  # visitor shares one global bucket, and a single abusive client's 429s
  # apply to everyone, turning a per-IP control into a site-wide DoS lever.
  #
  # 172.16.0.0/12 covers Docker's default bridge network pools -- this trusts
  # the NAT hop, nothing further out. real_ip_recursive walks X-Forwarded-For
  # right-to-left, skipping entries that are themselves in the trusted set,
  # and stops at the first (i.e. rightmost) one that isn't -- that becomes
  # $remote_addr. Cloudflare's ranges are deliberately NOT added to the
  # trusted set: that's a separate decision with its own blast radius (it
  # would mean trusting Cloudflare's word for every downstream header on
  # every route, not just this one) and is out of scope here. With only the
  # Docker bridge trusted, the rightmost untrusted X-Forwarded-For entry is
  # used, which is the real client for this topology.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Exact match, so it takes precedence over the /api/ prefix below without
  # reordering anything. /api/health stays on the plain proxy.
  location = /api/contact {
    limit_req zone=contact burst=5 nodelay;
    # nginx's default limit_req_status is 503, which this feature also uses for
    # "spool write failed -- the message was NOT retained". Without this, a
    # rate-limited request and a lost message would be indistinguishable to
    # the client and in logs.
    limit_req_status 429;
    client_max_body_size 16k;
    client_body_buffer_size 16k;   # r.requestText needs the body in memory
    # Must match the mailer's derived inbox path (`${QUEUE_DIR}/inbox`). Kept
    # here rather than inside spool.js so it stays changeable without
    # rebuilding the web image.
    set $inbox_dir /data/inbox;
    js_content spool.handle;
  }

  location = /internal/mailer {
    internal;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $mailer_upstream http://mailer:3000;
    proxy_pass $mailer_upstream/api/contact;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Contact form -> mailer sidecar. The upstream is resolved at request time via
  # Docker's embedded DNS (127.0.0.11) and held in a variable, so nginx still
  # starts (and recovers) when the mailer is momentarily down or being
  # auto-updated, instead of failing to boot on an unresolvable name.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $mailer_upstream http://mailer:3000;
    proxy_pass $mailer_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ =404;   # directory index resolves /photography/ -> index.html
  }
  error_page 404 /404.html;       # Astro emits dist/404.html
}
