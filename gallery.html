<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STUDIO JUS10 - Gallery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Noto+Serif+SC:wght@200..900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/gallery.css">
  <script>(function(){var t=localStorage.getItem('co-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
</head>
<body class="antialiased">
  <div id="nav-root"></div>
  <script src="assets/js/nav.js"></script>

  <div class="grain" aria-hidden="true"></div>

  <main id="gallery-page">
    <header class="gallery-header">
      <a id="gallery-back" href="photography.html" class="back-link">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        <span id="gallery-back-label">Photography</span>
      </a>
      <div>
        <span id="gallery-pill" class="gallery-pill"></span>
        <h1 class="gallery-title">
          <span id="gallery-title-text"></span>
          <span id="gallery-cjk" class="gallery-cjk"></span>
        </h1>
        <p id="gallery-note" class="gallery-note"></p>
      </div>
    </header>

    <div class="gallery-grid" id="galleryGrid"></div>
  </main>

  <main id="gallery-error" class="gallery-error" hidden>
    <p class="gallery-pill">Photography</p>
    <h1 class="gallery-title">Gallery not found</h1>
    <p class="gallery-note">Choose a series from the photography page.</p>
    <a href="photography.html" class="back-link">View photography</a>
  </main>

  <footer class="page-footer">
    <div class="footer-studio">STUDIO JUS10</div>
    <div class="footer-cjk">工作室</div>
    <div class="footer-links">
      <a href="https://instagram.com">Instagram</a>
      <a href="https://linkedin.com">LinkedIn</a>
      <a href="mailto:studiojus10@gmail.com">Email</a>
    </div>
    <div class="footer-copy">© 2025 STUDIO JUS10 · Photography · Colorado Springs</div>
  </footer>

  <div id="lightbox" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-10" style="background-color:rgba(6,5,4,0.93);backdrop-filter:blur(10px);">
    <div id="lightbox-inner" class="relative flex flex-col items-center max-w-5xl w-full">
      <button id="lightbox-close" aria-label="Close" style="position:absolute;top:-50px;right:0;color:var(--fg);background:none;border:none;cursor:pointer;padding:8px;opacity:0.8;transition:opacity 0.2s;">
        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      <div class="relative w-full flex items-center justify-center">
        <button id="lightbox-prev" aria-label="Previous" class="lightbox-nav lightbox-prev">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <img id="lightbox-img" src="" alt="" class="lightbox-image">
        <button id="lightbox-next" aria-label="Next" class="lightbox-nav lightbox-next">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
      <p id="lightbox-caption" class="lightbox-caption"></p>
      <div class="lb-strip" id="lb-strip"></div>
    </div>
  </div>

  <script src="assets/js/gallery-data.js"></script>
  <script src="assets/js/gallery-lightbox.js"></script>
  <script src="assets/js/gallery-page.js"></script>
</body>
</html>
