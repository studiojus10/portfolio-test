<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STUDIO JUS10 - Travels</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Noto+Serif+SC:wght@200..900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind-config.js"></script>

  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/gallery.css" />
  <script>(function(){var t=localStorage.getItem('co-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>

</head>
<body class="antialiased">

  <!-- Nav -->
  <div id="nav-root"></div>
  <script src="assets/js/nav.js"></script>

  <!-- Film grain -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Gallery header -->
  <div class="gallery-header">
    <a href="photography-arizona.html" class="back-link">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      Arizona
    </a>
    <div>
      <span class="gallery-pill">Travels</span>
      <h1 class="gallery-title">
        Travels
        <span class="gallery-cjk">旅途</span>
      </h1>
      <p class="gallery-note">Desert roads and canyon light across the Southwest.</p>
    </div>
  </div>

  <!-- Gallery grid -->
  <div class="gallery-grid" id="galleryGrid"></div>

  <!-- Footer -->
  <footer class="page-footer">
    <div class="footer-studio">STUDIO JUS10</div>
    <div class="footer-cjk">工作室</div>
    <div class="footer-links">
      <a href="https://instagram.com">Instagram</a>
      <a href="https://linkedin.com">LinkedIn</a>
      <a href="mailto:studiojus10@gmail.com">Email</a>
    </div>
    <div class="footer-copy">© 2025 STUDIO JUS10 · Photography · Colorado Springs</div>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-10" style="background-color:rgba(6,5,4,0.93);backdrop-filter:blur(10px);">
    <div id="lightbox-inner" class="relative flex flex-col items-center max-w-5xl w-full">
      <button id="lightbox-close" aria-label="Close" style="position:absolute;top:-50px;right:0;color:var(--fg);background:none;border:none;cursor:pointer;padding:8px;opacity:0.8;transition:opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">
        <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <div class="relative w-full flex items-center justify-center">
        <button id="lightbox-prev" aria-label="Previous" style="position:absolute;left:0;z-index:10;color:var(--fg);background:rgba(0,0,0,0.45);border:none;cursor:pointer;padding:12px;transition:background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.75)'" onmouseout="this.style.background='rgba(0,0,0,0.45)'">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <img id="lightbox-img" src="" alt="" style="max-height:78vh;max-width:100%;width:auto;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,0.7);">
        <button id="lightbox-next" aria-label="Next" style="position:absolute;right:0;z-index:10;color:var(--fg);background:rgba(0,0,0,0.45);border:none;cursor:pointer;padding:12px;transition:background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.75)'" onmouseout="this.style.background='rgba(0,0,0,0.45)'">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <p id="lightbox-caption" style="margin-top:14px;font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);"></p>
      <div class="lb-strip" id="lb-strip"></div>
    </div>
  </div>

  <script src="assets/js/gallery-lightbox.js"></script>
  <script>
  (function () {
    var images = [];
    for (var i = 1; i <= 21; i++) {
      images.push('assets/images/arizona/travels/ARIZONA-' + String(i).padStart(2,'0') + '.jpg');
    }
    var label = 'Travels';
    StudioJus10Gallery.init({ images: images, label: label });
  })();
  </script>
</body>
</html>
