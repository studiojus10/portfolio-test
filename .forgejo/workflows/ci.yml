name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: docker            # NOTE: match this to the Forgejo runner's registered label (docker/native/ubuntu-latest)
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test
