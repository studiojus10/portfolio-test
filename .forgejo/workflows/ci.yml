# Forgejo Actions CI for studiojus10 (self-hosted runner).
# The `docker` job builds the image and pushes it to the Forgejo container registry
# (published as a package), mirroring the ws-sim setup. It needs:
#   - REGISTRY_USER + REGISTRY_TOKEN (a write:package PAT) as repo/org Actions secrets
#   - a runner that mounts the host docker socket (the build talks to that daemon)
# First run may need tuning (runner label, docker socket, action resolution) — see ws-sim's notes.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: docker # NOTE: match this to the Forgejo runner's registered label (docker/native/ubuntu-latest)
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # Node 26 no longer ships corepack, so `corepack enable pnpm` is not an
      # option. Not `curl -fsSL https://get.pnpm.io/install.sh | sh` either:
      # that executes whatever the URL serves at the moment CI runs. pnpm
      # publishes standalone, Node-bundled release binaries on GitHub Releases,
      # and each asset's SHA256 is recorded in the release metadata at upload
      # time; the release is marked immutable, so neither the asset nor its
      # digest can be swapped after publication. Fetch the pinned release and
      # verify that digest BEFORE anything is executed.
      #
      # The tarball's top-level `pnpm` is a Node "single executable" that
      # resolves `dist/` next to itself at runtime, so both are extracted
      # together into one directory rather than dropped into a bin dir.
      #
      # Must run BEFORE setup-node: `cache: pnpm` below shells out to
      # `pnpm store path`, which needs pnpm already on PATH.
      #
      # To bump: set PNPM_VERSION, then take the new digest from
      #   https://api.github.com/repos/pnpm/pnpm/releases/tags/v$PNPM_VERSION
      #   (the "digest" field on the pnpm-linux-x64.tar.gz asset).
      # Keep it in step with `packageManager` in package.json and the pins in
      # both Dockerfiles.
      - name: Install pnpm (pinned, checksum-verified)
        env:
          PNPM_VERSION: "11.3.0"
          PNPM_SHA256: "6eb506b53297eb1186ba0cbff1577bb26d17713835a01a5342dcafae550827ce"
        run: |
          set -euo pipefail
          TARBALL=pnpm-linux-x64.tar.gz
          curl -fsSL --retry 3 -o "$TARBALL" \
            "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${TARBALL}"
          echo "${PNPM_SHA256}  ${TARBALL}" | sha256sum -c -
          mkdir -p "$HOME/.local/pnpm"
          tar xzf "$TARBALL" -C "$HOME/.local/pnpm"
          rm -f "$TARBALL"
          echo "$HOME/.local/pnpm" >> "$GITHUB_PATH"
          "$HOME/.local/pnpm/pnpm" --version
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # The mailer is a separate pnpm root with its own lockfile and is
      # deliberately NOT installed here: `check` runs its tests via
      # `pnpm --dir mailer test`, and they import only ./validate.js and
      # ./queue.js -- never server.js, the one file that needs nodemailer.
      # Same as it was under npm.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check # astro check + biome
      - run: pnpm run build # astro build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test

  # Build + push the image to the Forgejo registry (published as a container package) — only after
  # `verify` passes, never on a PR, never on a cancelled run.
  docker:
    needs: [verify]
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.verify.result == 'success'
    runs-on: docker # runner default image (node + git) + the host docker socket the runner mounts in
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # The job image has git + node (for checkout) but no docker CLI. Drop in the static docker
      # client + the buildx plugin (for BuildKit); both talk to the daemon socket the runner mounts.
      # Bump the pins as needed.
      - name: Install the docker CLI + buildx plugin
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64 -o "$HOME/.docker/cli-plugins/docker-buildx"
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forge.daveynet.xyz -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      # Build in an isolated `docker-container` builder, NOT the daemon's default `docker` driver.
      # The default driver LOADS every built tag (`:latest` + `:sha-<commit>`) into the host image
      # store this runner shares with the running site container — which would drag `:latest` onto the
      # fresh image and break What's-Up-Docker auto-updates. The docker-container driver pushes straight
      # to the registry without touching the host store.
      #
      # Reattach, don't rebuild: the buildkit container + its `_state` cache volume persist on the host.
      # `buildx create` isn't idempotent, so drop any stale container by name — `docker rm`, NOT
      # `docker buildx rm` (which would also delete the cache volume) — then recreate; it re-mounts the
      # same `_state` volume so the BuildKit cache stays warm across runs.
      - name: Set up an isolated buildx builder (keeps CI out of the host image store)
        run: |
          docker rm -f buildx_buildkit_studiojus10-wud0 >/dev/null 2>&1 || true
          docker buildx create --name studiojus10-wud --driver docker-container --use
      - name: Compute tags
        id: t
        env: # values via env, not inline ${{ }}, so a crafted ref name can't inject shell
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMG="forge.daveynet.xyz/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          MAILER_IMG="${IMG}-mailer"
          SHORT="sha-$(echo "$SHA" | cut -c1-7)"
          TAGS="$IMG:$SHORT"
          MAILER_TAGS="$MAILER_IMG:$SHORT"
          if [ "$REF" = 'refs/heads/main' ]; then
            TAGS="$TAGS,$IMG:latest"
            MAILER_TAGS="$MAILER_TAGS,$MAILER_IMG:latest"
          fi
          case "$REF" in
            refs/tags/v*) V="${REF_NAME#v}"; TAGS="$TAGS,$IMG:$V"; MAILER_TAGS="$MAILER_TAGS,$MAILER_IMG:$V" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "mailer_tags=$MAILER_TAGS" >> "$GITHUB_OUTPUT"
      # No registry cache: Forgejo is behind Cloudflare, whose 100 MB request-body cap rejects the large
      # mode=max cache blobs with a 413. The persistent builder above keeps a warm local BuildKit cache
      # instead. --provenance/--sbom OFF so Forgejo registers a plain container manifest (not an OCI
      # index with attestation manifests it won't display as a package). `--push` ships every tag at once.
      - name: Build & push
        env: # values via env, not inline ${{ }}
          TAGS: ${{ steps.t.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ARGS=""
          for t in $(echo "$TAGS" | tr ',' ' '); do ARGS="$ARGS -t $t"; done
          docker buildx build --builder studiojus10-wud $ARGS \
            --build-arg COMMIT_HASH="$SHA" \
            --provenance=false --sbom=false \
            --push .

      # Belt-and-braces, not the primary gate: `RUN nginx -t` in the Dockerfile
      # now fails the build itself, before `--push` ever runs, in any context
      # that builds this image (including a PR branch built locally) -- this
      # job still only runs post-merge, so it re-checks the already-pushed
      # image rather than catching the problem pre-merge.
      - name: Verify njs compiles in the built image
        env:
          TAGS: ${{ steps.t.outputs.tags }}
        run: |
          set -eu
          FIRST_TAG=$(echo "$TAGS" | cut -d, -f1)
          # `--rm` only removes the container; the pulled image would otherwise
          # linger in the host store this whole workflow works to keep clean.
          # A trap, not a line after `docker run`, because under `set -eu` a
          # failing `nginx -t` exits the script immediately -- the line after
          # would never run, and the pulled image would be exactly the thing
          # left behind by the failure this step is meant to catch. The trap
          # still runs on that early exit, and doesn't touch the exit status
          # `docker run` set, so `nginx -t` failing still fails the build.
          trap 'docker rmi "$FIRST_TAG" >/dev/null 2>&1 || true' EXIT
          docker run --rm "$FIRST_TAG" nginx -t

      # Same builder, same rules — build & push the contact-form mailer sidecar
      # as a second package so the host's What's-Up-Docker can auto-update it too.
      - name: Build & push mailer
        env:
          TAGS: ${{ steps.t.outputs.mailer_tags }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ARGS=""
          for t in $(echo "$TAGS" | tr ',' ' '); do ARGS="$ARGS -t $t"; done
          docker buildx build --builder studiojus10-wud $ARGS \
            --build-arg COMMIT_HASH="$SHA" \
            --provenance=false --sbom=false \
            --push ./mailer
